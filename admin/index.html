<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RECED — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../supabase-config.js"></script>
<style>
:root{
  --bg:#0F0A08; --bg-surface:#171110; --bg-elev:#201816;
  --accent:#D6773A; --text:#F4EFEB; --text-2:#A99B92; --border:rgba(244,239,235,.10);
  --danger:#D6483A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0}
a{color:var(--accent)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;background:var(--bg-elev);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:10px 12px;font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);display:block;margin-bottom:6px}
.btn{background:var(--accent);color:var(--bg);border:none;border-radius:4px;padding:10px 18px;font-size:13px;font-weight:600;letter-spacing:.03em}
.btn:hover{background:#e08a4d}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border);border-radius:4px;padding:10px 18px;font-size:13px}
.btn-ghost:hover{color:var(--text);border-color:var(--accent)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);border-radius:4px;padding:6px 12px;font-size:12px}
.btn-danger:hover{background:var(--danger);color:#fff}
.card{background:var(--bg-elev);border:1px solid var(--border);border-radius:6px;padding:20px}
.field{display:flex;flex-direction:column;gap:6px}
.grid{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.topbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:rgba(15,10,8,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.container{max-width:960px;margin:0 auto;padding:32px 24px 96px}
.item-row{display:flex;gap:14px;align-items:center;background:var(--bg-surface);border:1px solid var(--border);border-radius:6px;padding:12px 14px}
.item-row img{width:56px;height:56px;object-fit:cover;border-radius:4px;background:var(--bg-elev);flex:none}
.item-row .meta{flex:1;min-width:0}
.item-row .meta strong{display:block;font-size:14px}
.item-row .meta span{display:block;font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg{font-size:13px;padding:10px 14px;border-radius:4px;margin-bottom:16px}
.msg-error{background:rgba(214,72,58,.15);color:#ff9d8f;border:1px solid rgba(214,72,58,.3)}
.msg-ok{background:rgba(214,119,58,.15);color:var(--accent);border:1px solid rgba(214,119,58,.3)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:20px}
.tabs{display:flex;gap:8px;margin-bottom:24px}
.tab{background:transparent;border:1px solid var(--border);color:var(--text-2);padding:10px 18px;border-radius:4px;font-size:13px;letter-spacing:.05em}
.tab.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.section{display:none}
.section.active{display:block}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="login-view" class="login-wrap hidden">
  <form id="login-form" class="login-card card">
    <div>
      <h1 style="font-size:22px">RECED — Admin</h1>
      <p style="color:var(--text-2);font-size:13px;margin:6px 0 0">Entre para gerenciar portfólio e depoimentos.</p>
    </div>
    <div id="login-msg"></div>
    <div class="field">
      <label for="login-email">E-mail</label>
      <input id="login-email" type="email" required autocomplete="username">
    </div>
    <div class="field">
      <label for="login-password">Senha</label>
      <input id="login-password" type="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn" id="login-btn">Entrar</button>
  </form>
</div>

<div id="app-view" class="hidden">
  <div class="topbar">
    <strong style="font-family:'Space Grotesk',sans-serif">RECED — Admin</strong>
    <div class="row">
      <a href="../index.html" target="_blank" style="font-size:12px;color:var(--text-2)">Ver site ↗</a>
      <button class="btn-ghost" id="logout-btn">Sair</button>
    </div>
  </div>
  <div class="container">
    <div class="tabs">
      <button class="tab active" data-tab="portfolio">Portfólio</button>
      <button class="tab" data-tab="testimonials">Depoimentos</button>
    </div>

    <section id="tab-portfolio" class="section active">
      <div class="grid" style="grid-template-columns:1fr;margin-bottom:32px">
        <div class="card">
          <h2 style="font-size:16px;margin-bottom:16px" id="portfolio-form-title">Novo item do portfólio</h2>
          <div id="portfolio-msg"></div>
          <form id="portfolio-form" class="grid" style="grid-template-columns:1fr 1fr">
            <input type="hidden" id="portfolio-id">
            <div class="field"><label for="p-title">Título</label><input id="p-title" required></div>
            <div class="field"><label for="p-kind">Tipo (ex: Cover, Autoral, Evento)</label><input id="p-kind"></div>
            <div class="field">
              <label for="p-category">Categoria</label>
              <select id="p-category">
                <option value="musica">Música</option>
                <option value="eventos">Eventos</option>
                <option value="institucional">Institucional</option>
              </select>
            </div>
            <div class="field"><label for="p-order">Ordem</label><input id="p-order" type="number" value="0"></div>
            <div class="field" style="grid-column:1/-1"><label for="p-youtube">Link do YouTube (opcional)</label><input id="p-youtube" type="url" placeholder="https://youtube.com/watch?v=..."></div>
            <div class="field" style="grid-column:1/-1"><label for="p-image">Foto de capa</label><input id="p-image" type="file" accept="image/png,image/jpeg,image/webp"></div>
            <div class="row" style="grid-column:1/-1">
              <button type="submit" class="btn" id="portfolio-submit">Adicionar</button>
              <button type="button" class="btn-ghost hidden" id="portfolio-cancel">Cancelar edição</button>
            </div>
          </form>
        </div>
      </div>
      <div id="portfolio-list" class="grid" style="grid-template-columns:1fr"></div>
    </section>

    <section id="tab-testimonials" class="section">
      <div class="grid" style="grid-template-columns:1fr;margin-bottom:32px">
        <div class="card">
          <h2 style="font-size:16px;margin-bottom:16px" id="testimonial-form-title">Novo depoimento</h2>
          <div id="testimonial-msg"></div>
          <form id="testimonial-form" class="grid" style="grid-template-columns:1fr 1fr">
            <input type="hidden" id="t-id">
            <div class="field" style="grid-column:1/-1"><label for="t-quote">Depoimento</label><textarea id="t-quote" rows="3" required></textarea></div>
            <div class="field"><label for="t-name">Nome</label><input id="t-name" required></div>
            <div class="field"><label for="t-role">Cargo / Igreja</label><input id="t-role"></div>
            <div class="field"><label for="t-order">Ordem</label><input id="t-order" type="number" value="0"></div>
            <div class="field"><label for="t-avatar">Foto</label><input id="t-avatar" type="file" accept="image/png,image/jpeg,image/webp"></div>
            <div class="row" style="grid-column:1/-1">
              <button type="submit" class="btn" id="testimonial-submit">Adicionar</button>
              <button type="button" class="btn-ghost hidden" id="testimonial-cancel">Cancelar edição</button>
            </div>
          </form>
        </div>
      </div>
      <div id="testimonials-list" class="grid" style="grid-template-columns:1fr"></div>
    </section>
  </div>
</div>

<script>
(function(){
  var cfg = window.RECED_SUPABASE;
  var client = window.supabase.createClient(cfg.url, cfg.publishableKey);
  var bucket = client.storage.from(cfg.mediaBucket);
  var CAT_LABELS = { musica: 'Música', eventos: 'Eventos', institucional: 'Institucional' };

  var loginView = document.getElementById('login-view');
  var appView = document.getElementById('app-view');

  function publicUrl(path){ return path ? bucket.getPublicUrl(path).data.publicUrl : ''; }

  function showMsg(elId, text, isError){
    var el = document.getElementById(elId);
    el.innerHTML = text ? '<div class="msg ' + (isError ? 'msg-error' : 'msg-ok') + '">' + text + '</div>' : '';
  }

  // ---------- Auth ----------
  async function checkSession(){
    var { data } = await client.auth.getSession();
    if (data.session) {
      loginView.classList.add('hidden');
      appView.classList.remove('hidden');
      loadPortfolio();
      loadTestimonials();
    } else {
      appView.classList.add('hidden');
      loginView.classList.remove('hidden');
    }
  }

  document.getElementById('login-form').addEventListener('submit', async function(e){
    e.preventDefault();
    var btn = document.getElementById('login-btn');
    btn.disabled = true;
    showMsg('login-msg', '');
    var email = document.getElementById('login-email').value.trim();
    var password = document.getElementById('login-password').value;
    var { error } = await client.auth.signInWithPassword({ email: email, password: password });
    btn.disabled = false;
    if (error) { showMsg('login-msg', 'Não foi possível entrar: ' + error.message, true); return; }
    checkSession();
  });

  document.getElementById('logout-btn').addEventListener('click', async function(){
    await client.auth.signOut();
    checkSession();
  });

  // ---------- Tabs ----------
  document.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
      document.querySelectorAll('.section').forEach(function(s){ s.classList.remove('active'); });
      tab.classList.add('active');
      document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    });
  });

  // ---------- Portfolio ----------
  var portfolioForm = document.getElementById('portfolio-form');
  var portfolioCancel = document.getElementById('portfolio-cancel');

  function resetPortfolioForm(){
    portfolioForm.reset();
    document.getElementById('portfolio-id').value = '';
    document.getElementById('portfolio-form-title').textContent = 'Novo item do portfólio';
    document.getElementById('portfolio-submit').textContent = 'Adicionar';
    portfolioCancel.classList.add('hidden');
  }

  portfolioCancel.addEventListener('click', resetPortfolioForm);

  async function loadPortfolio(){
    var { data, error } = await client.from('portfolio_items').select('*').order('sort_order');
    var list = document.getElementById('portfolio-list');
    if (error) { list.innerHTML = ''; showMsg('portfolio-msg', 'Erro ao carregar: ' + error.message, true); return; }
    list.innerHTML = (data || []).map(function(it){
      var img = publicUrl(it.image_path);
      return '<div class="item-row" data-id="' + it.id + '">' +
        (img ? '<img src="' + img + '" alt="">' : '<div style="width:56px;height:56px;border-radius:4px;background:var(--bg-elev);flex:none"></div>') +
        '<div class="meta"><strong>' + escapeHtml(it.title) + '</strong>' +
        '<span>' + (CAT_LABELS[it.category] || it.category) + (it.kind ? ' · ' + escapeHtml(it.kind) : '') + (it.youtube_url ? ' · tem link' : '') + '</span></div>' +
        '<button class="btn-ghost" data-action="edit-portfolio" style="padding:6px 12px;font-size:12px">Editar</button>' +
        '<button class="btn-danger" data-action="delete-portfolio">Excluir</button>' +
        '</div>';
    }).join('') || '<p style="color:var(--text-2);font-size:13px">Nenhum item ainda.</p>';
  }

  document.getElementById('portfolio-list').addEventListener('click', async function(e){
    var row = e.target.closest('.item-row');
    if (!row) return;
    var id = row.dataset.id;
    if (e.target.dataset.action === 'delete-portfolio') {
      if (!confirm('Excluir este item do portfólio?')) return;
      var { error } = await client.from('portfolio_items').delete().eq('id', id);
      if (error) { showMsg('portfolio-msg', 'Erro ao excluir: ' + error.message, true); return; }
      loadPortfolio();
    }
    if (e.target.dataset.action === 'edit-portfolio') {
      var { data, error } = await client.from('portfolio_items').select('*').eq('id', id).single();
      if (error) return;
      document.getElementById('portfolio-id').value = data.id;
      document.getElementById('p-title').value = data.title || '';
      document.getElementById('p-kind').value = data.kind || '';
      document.getElementById('p-category').value = data.category || 'musica';
      document.getElementById('p-order').value = data.sort_order || 0;
      document.getElementById('p-youtube').value = data.youtube_url || '';
      document.getElementById('portfolio-form-title').textContent = 'Editar item do portfólio';
      document.getElementById('portfolio-submit').textContent = 'Salvar alterações';
      portfolioCancel.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });

  portfolioForm.addEventListener('submit', async function(e){
    e.preventDefault();
    var submitBtn = document.getElementById('portfolio-submit');
    submitBtn.disabled = true;
    showMsg('portfolio-msg', '');
    try {
      var id = document.getElementById('portfolio-id').value || null;
      var payload = {
        title: document.getElementById('p-title').value.trim(),
        kind: document.getElementById('p-kind').value.trim(),
        category: document.getElementById('p-category').value,
        sort_order: parseInt(document.getElementById('p-order').value, 10) || 0,
        youtube_url: document.getElementById('p-youtube').value.trim() || null
      };
      var file = document.getElementById('p-image').files[0];
      if (file) {
        var path = 'portfolio/' + Date.now() + '-' + file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
        var { error: upErr } = await bucket.upload(path, file, { upsert: true });
        if (upErr) throw upErr;
        payload.image_path = path;
      }
      if (id) {
        var { error } = await client.from('portfolio_items').update(payload).eq('id', id);
        if (error) throw error;
      } else {
        var { error } = await client.from('portfolio_items').insert(payload);
        if (error) throw error;
      }
      showMsg('portfolio-msg', 'Salvo com sucesso.', false);
      resetPortfolioForm();
      loadPortfolio();
    } catch (err) {
      showMsg('portfolio-msg', 'Erro ao salvar: ' + err.message, true);
    } finally {
      submitBtn.disabled = false;
    }
  });

  // ---------- Testimonials ----------
  var testimonialForm = document.getElementById('testimonial-form');
  var testimonialCancel = document.getElementById('testimonial-cancel');

  function resetTestimonialForm(){
    testimonialForm.reset();
    document.getElementById('t-id').value = '';
    document.getElementById('testimonial-form-title').textContent = 'Novo depoimento';
    document.getElementById('testimonial-submit').textContent = 'Adicionar';
    testimonialCancel.classList.add('hidden');
  }

  testimonialCancel.addEventListener('click', resetTestimonialForm);

  async function loadTestimonials(){
    var { data, error } = await client.from('testimonials').select('*').order('sort_order');
    var list = document.getElementById('testimonials-list');
    if (error) { list.innerHTML = ''; showMsg('testimonial-msg', 'Erro ao carregar: ' + error.message, true); return; }
    list.innerHTML = (data || []).map(function(t){
      var img = publicUrl(t.avatar_path);
      return '<div class="item-row" data-id="' + t.id + '">' +
        (img ? '<img src="' + img + '" alt="" style="border-radius:50%">' : '<div style="width:56px;height:56px;border-radius:50%;background:var(--bg-elev);flex:none"></div>') +
        '<div class="meta"><strong>' + escapeHtml(t.author_name) + '</strong>' +
        '<span>' + escapeHtml(t.author_role || '') + '</span></div>' +
        '<button class="btn-ghost" data-action="edit-testimonial" style="padding:6px 12px;font-size:12px">Editar</button>' +
        '<button class="btn-danger" data-action="delete-testimonial">Excluir</button>' +
        '</div>';
    }).join('') || '<p style="color:var(--text-2);font-size:13px">Nenhum depoimento ainda.</p>';
  }

  document.getElementById('testimonials-list').addEventListener('click', async function(e){
    var row = e.target.closest('.item-row');
    if (!row) return;
    var id = row.dataset.id;
    if (e.target.dataset.action === 'delete-testimonial') {
      if (!confirm('Excluir este depoimento?')) return;
      var { error } = await client.from('testimonials').delete().eq('id', id);
      if (error) { showMsg('testimonial-msg', 'Erro ao excluir: ' + error.message, true); return; }
      loadTestimonials();
    }
    if (e.target.dataset.action === 'edit-testimonial') {
      var { data, error } = await client.from('testimonials').select('*').eq('id', id).single();
      if (error) return;
      document.getElementById('t-id').value = data.id;
      document.getElementById('t-quote').value = data.quote || '';
      document.getElementById('t-name').value = data.author_name || '';
      document.getElementById('t-role').value = data.author_role || '';
      document.getElementById('t-order').value = data.sort_order || 0;
      document.getElementById('testimonial-form-title').textContent = 'Editar depoimento';
      document.getElementById('testimonial-submit').textContent = 'Salvar alterações';
      testimonialCancel.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });

  testimonialForm.addEventListener('submit', async function(e){
    e.preventDefault();
    var submitBtn = document.getElementById('testimonial-submit');
    submitBtn.disabled = true;
    showMsg('testimonial-msg', '');
    try {
      var id = document.getElementById('t-id').value || null;
      var payload = {
        quote: document.getElementById('t-quote').value.trim(),
        author_name: document.getElementById('t-name').value.trim(),
        author_role: document.getElementById('t-role').value.trim(),
        sort_order: parseInt(document.getElementById('t-order').value, 10) || 0
      };
      var file = document.getElementById('t-avatar').files[0];
      if (file) {
        var path = 'testimonials/' + Date.now() + '-' + file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
        var { error: upErr } = await bucket.upload(path, file, { upsert: true });
        if (upErr) throw upErr;
        payload.avatar_path = path;
      }
      if (id) {
        var { error } = await client.from('testimonials').update(payload).eq('id', id);
        if (error) throw error;
      } else {
        var { error } = await client.from('testimonials').insert(payload);
        if (error) throw error;
      }
      showMsg('testimonial-msg', 'Salvo com sucesso.', false);
      resetTestimonialForm();
      loadTestimonials();
    } catch (err) {
      showMsg('testimonial-msg', 'Erro ao salvar: ' + err.message, true);
    } finally {
      submitBtn.disabled = false;
    }
  });

  function escapeHtml(s){
    return String(s || '').replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  client.auth.onAuthStateChange(function(){ checkSession(); });
  checkSession();
})();
</script>
</body>
</html>
